name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get versions
        id: version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "REV=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish app
        shell: bash
        run: |
          dotnet publish LucasScreentime/LucasScreentime.csproj \
            -c Release \
            -r win-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:DebugType=none \
            -p:Version=1.0.${{ steps.version.outputs.REV }} \
            -o publish/

      - name: Package with Velopack
        shell: bash
        run: |
          vpk pack \
            --packId "LucasScreentime" \
            --packVersion "${{ steps.version.outputs.VERSION }}" \
            --packDir "publish/" \
            --mainExe "LucasScreentime.exe" \
            --outputDir "releases/" \
            --packTitle "Lucas Screentime"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: releases/*
